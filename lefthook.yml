pre-commit:
  parallel: true
  commands:
    lint:
      run: npx eslint .
    typecheck:
      run: npx tsc --noEmit
    # Nothing private reaches a public repository: see CONTRIBUTING.md.
    public-check:
      run: bash scripts/public-check.sh
    # GitGuardian's secret scanner. Required: a machine without it fails the commit, on purpose.
    # Set up once with `brew install ggshield` and `ggshield auth login` (see CONTRIBUTING.md).
    # A confirmed false positive: `ggshield secret ignore --last-found`, never --no-verify.
    ggshield:
      run: ggshield secret scan pre-commit
