#
# One file on the default branch covers every long-lived branch: Dependabot only reads
# `main`, and `target-branch` points an entry at the Android and iOS trees.
# Version-update PRs are OFF: `open-pull-requests-limit: 0` on every entry (Alan, 2026-11-21).
# Security updates are a repository setting, are not counted against the limit, and still open.
# Raise a limit to bring that entry's version updates back.
version: 2
updates:
  # --- main: the daemon ---------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift this once it accepts 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Types track the oldest Node CI runs (22), so code cannot lean on newer APIs unnoticed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  # --- main: the Windows program (windows/) ----------------------------------------
  - package-ecosystem: nuget
    directory: /windows
    target-branch: main
    schedule: { interval: weekly }
    open-pull-requests-limit: 0

  # --- usage-android: the Android dashboard --------------------------------------
  - package-ecosystem: gradle
    directory: /
    target-branch: usage-android
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    target-branch: usage-android
    schedule: { interval: weekly }
    open-pull-requests-limit: 0

  # --- usage-ios: the iPhone and watch app ---------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: usage-ios
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
