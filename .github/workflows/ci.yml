name: ci
# The app lives on the `usage-android` branch of the daemon's repo. Scoped to that branch on purpose
# (no wildcard): the daemon's own release job runs on `main` and must never race this one.
on:
  push: { branches: [usage-android] }
  pull_request: {}

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

jobs:
  # Runs for every pull request, including ones from forks, so it gets a read-only token and
  # reads no secret. Everything it executes is code from the change under test.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default list includes the retired `tools` package, which Google's
          # repository stopped serving in September 2026 and sdkmanager then fails outright.
          packages: platform-tools build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Public-repository check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          scripts/public-check.sh --self-test
          if [ -n "$BASE_REF" ]; then
            scripts/public-check.sh --diff "origin/$BASE_REF...HEAD"
          fi
      - run: ./gradlew ktlintCheck :core:test :fakedaemon:test :app:testDebugUnitTest :app:assembleDebug
      # Without this the emulator has no hardware acceleration on the Linux runner, takes
      # ten minutes to boot and then stops answering adb ("No compatible devices connected").
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator runner installs this itself, but Google's download sometimes arrives
      # truncated ("Error on ZipFile unknown archive") and the job then fails with no device.
      # Installed here first, with retries, the runner finds it already present.
      - name: Install the Android emulator
        run: |
          for attempt in 1 2 3; do
            sdkmanager --install emulator --channel=0 > /dev/null || true
            if [ -x "$ANDROID_HOME/emulator/emulator" ]; then exit 0; fi
            echo "emulator install attempt $attempt failed; retrying"
            sdkmanager --uninstall emulator > /dev/null 2>&1 || true
            sleep 15
          done
          exit 1
      - name: Instrumented tests (API 29)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

  # Builds, signs and publishes — only for a push to usage-android, only after `test` is green,
  # and only inside the `release-android` environment, which is where the signing secrets belong (and
  # where the owner can require an approval). First-party steps only: nothing here but GitHub's
  # own actions, the Android SDK's apksigner and the `gh` CLI ever sees a secret or the write token.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/usage-android'
    runs-on: ubuntu-latest
    environment: release-android
    concurrency: { group: deck-release, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      # Without the signing secrets the tests still gate the branch and nothing is published.
      - name: Signing available?
        id: signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "ok=$([ -n "$SIGNING_KEYSTORE_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.ok == 'true'
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.signing.outputs.ok == 'true'
        with: { distribution: temurin, java-version: '17' }
      - name: Install build-tools 34.0.0
        if: steps.signing.outputs.ok == 'true'
        # The runner image ships the SDK and its sdkmanager; no third-party action is needed here.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" >/dev/null
      - name: Assemble release (unsigned)
        if: steps.signing.outputs.ok == 'true'
        run: ./gradlew :app:assembleRelease
      # apksigner rather than Gradle: the phone was provisioned with a debug-signed build, and only
      # a v3 signature carrying app/signing/usage-deck.lineage (debug key → release key) installs
      # over it in place, keeping Device Owner and the pairing. v1/v2 are off because minSdk is 29
      # and both would need the retired debug key present at signing time.
      #
      # The keystore is written once, readable by this user only, under the runner's temp dir.
      # Passwords never touch the disk or the command line: apksigner reads them from the
      # environment. No `set -x`: a trace would print whatever a later edit put on a command line.
      - name: Sign release
        if: steps.signing.outputs.ok == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          # Optional: only when the key's password differs from the store's.
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          BT="$ANDROID_HOME/build-tools/34.0.0"   # the version the lineage and the phone were verified with
          KEYSTORE="$RUNNER_TEMP/release.jks"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          KEY_PASS=env:SIGNING_STORE_PASSWORD
          if [ -n "${SIGNING_KEY_PASSWORD:-}" ]; then KEY_PASS=env:SIGNING_KEY_PASSWORD; fi
          "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$ALIGNED"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass "$KEY_PASS" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --lineage app/signing/usage-deck.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out usage-deck.apk "$ALIGNED"
          "$BT/apksigner" verify --print-certs -v usage-deck.apk
      - name: Delete key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
      # Spec §23.17: tag `deck-<version>`, assets `usage-deck.apk` + `usage-deck.apk.sha256`, always a
      # pre-release so the daemon's /releases/latest never returns an APK.
      - name: Publish
        if: steps.signing.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.1.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)"
          sha256sum usage-deck.apk > usage-deck.apk.sha256
          gh release create "deck-$VERSION" usage-deck.apk usage-deck.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Usage Deck $VERSION" --notes "Usage Deck $VERSION, built from $GITHUB_SHA."
